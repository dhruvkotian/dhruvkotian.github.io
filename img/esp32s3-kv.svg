  <rect x="32" y="372" width="696" height="66" fill="#061a28" stroke="#1b5d75" stroke-width="3"/>
  <text x="48" y="398" fill="#9ff5e4" font-family="monospace" font-size="11" letter-spacing="1">260K PARAMS · 5 LAYERS · 8 HEADS / 4 KV · 512 CTX</text>
  <text x="48" y="422" fill="#ffd76a" font-family="monospace" font-size="12" letter-spacing="1">166.6 DECODE FORWARDS/S · 6.00 MS/FORWARD</text>
