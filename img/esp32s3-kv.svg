    <rect x="48" y="206" width="24" height="24" fill="#7ef9ff" opacity=".58"/><rect x="76" y="206" width="24" height="24" fill="#7ef9ff" opacity=".58"/><rect x="104" y="206" width="24" height="24" fill="#7ef9ff" opacity=".58"/><rect x="132" y="206" width="24" height="24" fill="#7ef9ff" opacity=".58"/><rect x="160" y="206" width="24" height="24" fill="#7ef9ff" opacity=".58"/><rect x="188" y="206" width="24" height="24" fill="#7ef9ff" opacity=".58"/><rect x="216" y="206" width="24" height="24" fill="#7ef9ff" opacity=".58"/><rect x="244" y="206" width="24" height="24" fill="#7ef9ff" opacity=".58"/><rect x="272" y="206" width="24" height="24" fill="#7ef9ff" opacity=".58"/>
