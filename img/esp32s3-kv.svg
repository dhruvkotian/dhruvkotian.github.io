  <text x="48" y="118" fill="#ffd76a" font-family="monospace" font-size="13" letter-spacing="1">SRAM 512 KB</text>
  <text x="48" y="136" fill="#9dc2d2" font-family="monospace" font-size="9">ACTIVE EXECUTION</text>
  <g>
