  <text x="444" y="256" fill="#9dc2d2" font-family="monospace" font-size="9">K + V INT8, ONE FP32 SCALE PER HEAD</text>
  <text x="444" y="282" fill="#9ff5e4" font-family="monospace" font-size="12" letter-spacing="1">245,760 B PAYLOAD</text>
  <text x="444" y="304" fill="#9dc2d2" font-family="monospace" font-size="9">5 LAYERS · 4 KV HEADS · 512 POSITIONS</text>

