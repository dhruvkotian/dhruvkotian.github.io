    <rect x="444" y="150" width="24" height="24" fill="#7ef9ff" opacity=".9"/><rect x="472" y="150" width="24" height="24" fill="#7ef9ff" opacity=".9"/><rect x="500" y="150" width="24" height="24" fill="#7ef9ff" opacity=".9"/><rect x="528" y="150" width="24" height="24" fill="#7ef9ff" opacity=".9"/><rect x="556" y="150" width="24" height="24" fill="#7ef9ff" opacity=".9"/><rect x="584" y="150" width="24" height="24" fill="#7ef9ff" opacity=".9"/><rect x="612" y="150" width="24" height="24" fill="#7ef9ff" opacity=".9"/><rect x="640" y="150" width="24" height="24" fill="#7ef9ff" opacity=".9"/><rect x="668" y="150" width="24" height="24" fill="#7ef9ff" opacity=".9"/>
