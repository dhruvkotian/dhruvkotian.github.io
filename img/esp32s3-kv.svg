<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" width="760" height="475" role="img" aria-label="Schematic of the ESP32-S3 memory hierarchy: 512 KB SRAM holding int8 weights and a 16-position fp32 hot window, and 8 MB PSRAM holding the 245,760-byte int8 KV cache, scanned at 51.7 MB/s.">
