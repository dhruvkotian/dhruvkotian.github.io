  <g stroke="#0d3a4d" stroke-width="1" opacity=".55">
    <path d="M0 19H760M0 38H760M0 57H760M0 76H760M0 95H760M0 114H760M0 133H760M0 152H760M0 171H760M0 190H760M0 209H760M0 228H760M0 247H760M0 266H760M0 285H760M0 304H760M0 323H760M0 342H760M0 361H760M0 380H760M0 399H760M0 418H760M0 437H760M0 456H760"/>
